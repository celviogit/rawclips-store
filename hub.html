<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Clips - Admin Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-base: #0F0F12;
            --bg-sidebar: #151520;
            --bg-card: #1A1A24;
            --bg-surface: #252535;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B8;
            --accent-start: #7957FF;
            --accent-end: #FF4D9D;
            --error: #FF4D4D;
            --success: #00CC66;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--bg-surface); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Typography & Gradients */
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            color: white;
        }

        h1, h2, h3, h4 { font-weight: 700; }
        
        /* Buttons & Inputs */
        button {
            cursor: pointer;
            border: none;
            outline: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            color: white;
            padding: 12px 24px;
            box-shadow: 0 4px 15px rgba(121, 87, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(121, 87, 255, 0.4);
        }

        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-primary);
            padding: 10px 20px;
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        
        .btn-icon {
            background: transparent;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 6px;
        }
        .btn-icon:hover { color: var(--text-primary); background: var(--bg-surface); }
        .btn-delete:hover { color: var(--error); background: rgba(255, 77, 77, 0.1); }

        input, textarea {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--accent-start); }
        label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 13px; font-weight: 500; }

        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-base);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .login-box {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .login-box h2 { font-size: 28px; margin-bottom: 30px; }
        .login-stage { display: none; }
        .login-stage.active { display: block; animation: fadeIn 0.3s ease; }
        
        .login-input-group { margin-bottom: 24px; text-align: left; }
        .login-input-group input { font-size: 18px; letter-spacing: 2px; text-align: center; }
        
        .error-text { color: var(--error); font-size: 13px; margin-top: 8px; min-height: 20px; display: block; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s ease; }

        /* Layout */
        .sidebar {
            width: 240px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            transition: transform 0.3s ease;
        }

        .brand { padding: 0 24px 30px; }
        .brand h1 { font-size: 24px; margin-bottom: 4px; }
        .brand span { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 1px;}

        .nav-items { flex: 1; }
        .nav-item {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text-primary); }
        .nav-item.active {
            background: linear-gradient(90deg, rgba(121, 87, 255, 0.1) 0%, transparent 100%);
            color: var(--text-primary);
            border-left-color: var(--accent-start);
        }

        .sidebar-footer { padding: 24px; border-top: 1px solid var(--border-color); }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }
        
        .header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 15, 18, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h2 { font-size: 22px; }

        .tab-content { padding: 40px; display: none; }
        .tab-content.active { display: block; animation: slideUp 0.4s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Accordion / Catalog UI */
        .catalog-container { max-width: 900px; margin: 0 auto; }
        
        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .item-card:hover { border-color: rgba(255,255,255,0.2); }
        
        .item-header {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }
        .item-title { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; }
        .item-actions { display: flex; gap: 8px; opacity: 0; transition: opacity 0.2s; }
        .item-header:hover .item-actions { opacity: 1; }
        
        .item-body {
            padding: 0 24px 24px 48px;
            display: none;
            border-top: 1px solid var(--border-color);
            margin-top: 16px;
            padding-top: 24px;
        }
        .item-card.expanded > .item-body { display: block; }
        
        .chevron { transition: transform 0.3s ease; }
        .item-card.expanded > .item-header .chevron { transform: rotate(90deg); }

        /* Subcategories */
        .subcat-list { margin-bottom: 16px; }
        .subcat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .product-card {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .product-img { width: 100%; height: 140px; object-fit: cover; background: #222; }
        .product-info { padding: 12px; }
        .product-info h4 { font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { color: var(--accent-end); font-weight: 700; font-size: 15px; margin-bottom: 8px; }
        .product-desc { font-size: 12px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; background: rgba(0,0,0,0.6); padding: 4px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .product-card:hover .product-actions { opacity: 1; }

        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-start);
            background: transparent;
            border: 1px dashed var(--accent-start);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
        }
        .add-btn:hover { background: rgba(121, 87, 255, 0.1); }

        /* Insights */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
            margin-bottom: 24px;
        }
        .metric-card {
            background: rgba(26, 26, 36, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .metric-value { font-size: 36px; font-weight: 800; margin-bottom: 8px; }
        .metric-label { color: var(--text-secondary); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }

        /* Settings */
        .settings-container { max-width: 600px; margin: 0 auto; }
        .settings-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 16px;
        }
        .settings-card h3 { margin-bottom: 24px; font-size: 18px; }
        .form-group { margin-bottom: 20px; }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }

        /* Toasts */
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: var(--bg-surface);
            border-left: 4px solid var(--accent-start);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideInRight 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--error); }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        /* Icons (SVG strings via JS or inline) */
        svg { width: 20px; height: 20px; fill: currentColor; }

        /* Loading */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent-start);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

        @media (max-width: 768px) {
            .sidebar { position: fixed; z-index: 50; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .metrics-grid { grid-template-columns: 1fr; }
            .mobile-menu-btn { display: block; }
        }
        .mobile-menu-btn { display: none; background: none; color: white; padding: 8px; }
        @media (min-width: 769px) { .mobile-menu-btn { display: none; } }
        
        .content-blocks-editor { margin-top: 16px; }
        .content-block-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
            background: var(--bg-base);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .block-type-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-start);
            font-weight: 600;
            min-width: 80px;
            padding-top: 10px;
        }
        .block-value {
            flex: 1;
        }
        .add-block-menu {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .add-block-btn {
            font-size: 12px;
            padding: 6px 12px;
            background: rgba(121, 87, 255, 0.1);
            color: var(--accent-start);
            border: 1px dashed var(--accent-start);
            border-radius: 6px;
            cursor: pointer;
        }
        .add-block-btn:hover {
            background: rgba(121, 87, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2 class="gradient-text">Raw Clips Hub</h2>
            
            <!-- Stage 1 -->
            <div id="stage1" class="login-stage active">
                <div class="login-input-group">
                    <label>Enter Access Code</label>
                    <input type="text" id="accessCodeInput" placeholder="00:00" autocomplete="off" maxlength="5">
                    <span class="error-text" id="stage1Error"></span>
                </div>
                <button class="btn-primary w-100" style="width:100%" onclick="verifyStage1()">Continue</button>
            </div>

            <!-- Stage 2 -->
            <div id="stage2" class="login-stage">
                <div class="login-input-group">
                    <label>Enter Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••">
                    <span class="error-text" id="stage2Error"></span>
                </div>
                <button class="btn-primary w-100" style="width:100%" onclick="verifyStage2()">Access Dashboard</button>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <h1 class="gradient-text">Raw Clips</h1>
            <span>Admin Hub</span>
        </div>
        <div class="nav-items">
            <div class="nav-item active" onclick="switchTab('catalog')">
                <svg viewBox="0 0 24 24"><path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18-.21 0-.41-.06-.57-.18l-7.9-4.44A.991.991 0 013 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18.21 0 .41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9zM12 4.15L6.04 7.5 12 10.85l5.96-3.35L12 4.15zM5 15.91l6 3.38v-6.71L5 9.21v6.7zM19 15.91v-6.7l-6 3.38v6.71l6-3.39z"/></svg>
                Bundles
            </div>
            <div class="nav-item" onclick="switchTab('insights')">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                Insights
            </div>
            <div class="nav-item" onclick="switchTab('settings')">
                <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                Settings
            </div>
        </div>
        <div class="sidebar-footer">
            <button class="btn-secondary w-100" style="width:100%" onclick="location.reload()">Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div style="display:flex; align-items:center; gap:16px;">
                <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <h2 id="pageTitle">Bundles</h2>
            </div>
            <div id="sessionTime" style="color:var(--text-secondary); font-size:12px;"></div>
        </header>

        <!-- TAB: Catalog -->
        <div id="tab-catalog" class="tab-content active">
            <div class="catalog-container">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                    <h3>Your Bundles</h3>
                    <button class="btn-primary" onclick="openBundleModal()">+ Add Bundle</button>
                </div>
                <div id="catalogList">
                    <div class="loader" style="margin-top: 40px;"></div>
                </div>
            </div>
        </div>

        <!-- TAB: Insights -->
        <div id="tab-insights" class="tab-content">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-value gradient-text" id="stat-prod">0</div>
                    <div class="metric-label">Total Bundles</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value gradient-text" id="stat-val">₹0</div>
                    <div class="metric-label">Total Catalog Value</div>
                </div>
            </div>
        </div>

        <!-- TAB: Settings -->
        <div id="tab-settings" class="tab-content">
            <div class="settings-container">
                <div class="settings-card">
                    <h3>Change Password</h3>
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" id="cp_current">
                    </div>
                    <div class="form-group">
                        <label>New Password (min 4 chars)</label>
                        <input type="password" id="cp_new">
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="cp_confirm">
                    </div>
                    <button class="btn-primary" onclick="updatePassword()">Update Password</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Generic Modal for Add/Edit -->
    <div class="modal-overlay" id="formModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Item</h3>
                <button class="btn-icon" onclick="closeModal()">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div id="modalBody">
                <!-- Injected fields -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" id="modalSaveBtn" onclick="saveModalData()">Save</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h3 style="margin-bottom: 16px;">Are you sure?</h3>
            <p style="color:var(--text-secondary); margin-bottom: 24px;">This action cannot be undone.</p>
            <div style="display:flex; gap:12px; justify-content: center;">
                <button class="btn-secondary" onclick="document.getElementById('confirmModal').classList.remove('active')">Cancel</button>
                <button class="btn-primary" style="background:var(--error); box-shadow:none;" id="confirmBtn">Yes, Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // --- FIREBASE CONFIG (EXACT) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCPHJPLO_pA_T4UD8W5s7nm418HWuNydfc",
            authDomain: "fabricane-2366c.firebaseapp.com",
            databaseURL: "https://fabricane-2366c-default-rtdb.firebaseio.com",
            projectId: "fabricane-2366c",
            storageBucket: "fabricane-2366c.firebasestorage.app",
            messagingSenderId: "731658632483",
            appId: "1:731658632483:web:359737f7226edb686d2096"
        };
        const STORAGE_KEY = "beamng_store_v1";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        // --- UTILS ---
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

        // --- IMAGE UPLOAD ---
        function handleImageUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file', 'error');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                showToast('Image must be under 5MB', 'error');
                return;
            }

            const progressEl = document.getElementById('upload_progress');
            progressEl.style.display = 'block';
            progressEl.innerText = 'Processing image...';

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('fm_image').value = base64;
                const urlInput = document.getElementById('fm_image_url');
                if (urlInput) urlInput.value = base64;
                const preview = document.getElementById('fm_image_preview');
                preview.style.display = 'flex';
                preview.innerHTML = `<img src="${base64}" style="width:100%; height:100%; object-fit:cover;">`;
                progressEl.innerText = '✓ Processed!';
                setTimeout(() => { progressEl.style.display = 'none'; }, 2000);
                showToast('Image attached successfully');
            };
            reader.onerror = function() {
                progressEl.style.display = 'none';
                showToast('Failed to read image', 'error');
            };
            reader.readAsDataURL(file);
        }
        
        function showToast(msg, type='success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = msg;
            container.appendChild(toast);
            setTimeout(() => { if(toast.parentElement) toast.remove(); }, 3000);
        }

        // --- DUAL SECURITY LOGIN SYSTEM ---
        function getReversedTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const digits = h + m;
            const reversed = digits.split('').reverse().join('');
            return reversed.slice(0,2) + ':' + reversed.slice(2);
        }

        function getReversedTimeWithOffset(minutesOffset) {
            const now = new Date();
            now.setMinutes(now.getMinutes() + minutesOffset);
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const digits = h + m;
            const reversed = digits.split('').reverse().join('');
            return reversed.slice(0,2) + ':' + reversed.slice(2);
        }

        function verifyStage1() {
            const input = document.getElementById('accessCodeInput').value;
            const box = document.querySelector('.login-box');
            const err = document.getElementById('stage1Error');
            
            const validCodes = [
                getReversedTime(),
                getReversedTimeWithOffset(-1),
                getReversedTimeWithOffset(1)
            ];

            if (validCodes.includes(input)) {
                document.getElementById('stage1').classList.remove('active');
                document.getElementById('stage2').classList.add('active');
                err.innerText = '';
            } else {
                err.innerText = 'Invalid code';
                box.classList.remove('shake');
                void box.offsetWidth; // trigger reflow
                box.classList.add('shake');
            }
        }

        let actualPassword = "antigravity";

        function verifyStage2() {
            const input = document.getElementById('passwordInput').value;
            const box = document.querySelector('.login-box');
            const err = document.getElementById('stage2Error');
            
            if (input === actualPassword) {
                // success
                document.getElementById('loginOverlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loginOverlay').style.display = 'none';
                    initApp();
                }, 500);
            } else {
                err.innerText = 'Incorrect password';
                box.classList.remove('shake');
                void box.offsetWidth;
                box.classList.add('shake');
            }
        }

        // Fetch password upfront for Stage 2
        db.ref(`${STORAGE_KEY}/settings/password`).once('value', snap => {
            if (snap.exists() && snap.val() !== "") {
                actualPassword = snap.val();
            } else {
                // Write fallback on first load if missing
                db.ref(`${STORAGE_KEY}/settings/password`).set(actualPassword);
            }
        });

        // Add Enter key support for login
        document.getElementById('accessCodeInput').addEventListener('keypress', e => { if(e.key==='Enter') verifyStage1(); });
        document.getElementById('passwordInput').addEventListener('keypress', e => { if(e.key==='Enter') verifyStage2(); });

        // --- APP INIT & DATA SYNC ---
        let catalogData = {};
        
        function initApp() {
            const now = new Date();
            document.getElementById('sessionTime').innerText = `Logged in since: ${now.toLocaleTimeString()}`;
            
            db.ref(`${STORAGE_KEY}/categories`).on('value', snap => {
                catalogData = snap.val() || {};
                renderCatalog();
                updateInsights();
            });
        }

        // --- NAVIGATION ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            const titles = { 'catalog': 'Bundles', 'insights': 'Insights Dashboard', 'settings': 'Hub Settings' };
            document.getElementById('pageTitle').innerText = titles[tabId];
            
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        // --- DEFAULT CAT/SUBCAT (auto-created, hidden from UI) ---
        const DEFAULT_CAT_ID = '_default_cat';
        const DEFAULT_SUB_ID = '_default_sub';

        function ensureDefaultPath() {
            return db.ref(`${STORAGE_KEY}/categories/${DEFAULT_CAT_ID}`).once('value').then(snap => {
                if (!snap.exists()) {
                    return db.ref(`${STORAGE_KEY}/categories/${DEFAULT_CAT_ID}`).set({
                        name: '_default',
                        subcategories: { [DEFAULT_SUB_ID]: { name: '_default', products: {} } }
                    });
                } else {
                    const cat = snap.val();
                    if (!cat.subcategories || !cat.subcategories[DEFAULT_SUB_ID]) {
                        return db.ref(`${STORAGE_KEY}/categories/${DEFAULT_CAT_ID}/subcategories/${DEFAULT_SUB_ID}`).set({ name: '_default', products: {} });
                    }
                }
            });
        }

        // --- RENDER BUNDLES (flat product grid) ---
        function renderCatalog() {
            const list = document.getElementById('catalogList');
            
            // Collect ALL products from ALL categories into flat list
            let allBundles = [];
            for (const catId in catalogData) {
                const cat = catalogData[catId];
                if (!cat.subcategories) continue;
                for (const subId in cat.subcategories) {
                    const sub = cat.subcategories[subId];
                    if (!sub.products) continue;
                    for (const prodId in sub.products) {
                        allBundles.push({ ...sub.products[prodId], _prodId: prodId, _catId: catId, _subId: subId });
                    }
                }
            }

            if (allBundles.length === 0) {
                list.innerHTML = `<div class="empty-state">No bundles yet. Add your first one!</div>`;
                return;
            }

            let html = '<div class="products-grid">';
            for (const bundle of allBundles) {
                const imgSrc = bundle.image || '';
                const noImg = !imgSrc;
                html += `
                <div class="product-card">
                    <div class="product-actions">
                        <button class="btn-icon" style="color:white;" onclick="openBundleModal('${bundle._catId}', '${bundle._subId}', '${bundle._prodId}')">
                            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
                        </button>
                        <button class="btn-icon btn-delete" style="color:#FF4D4D;" onclick="confirmDelete('categories/${bundle._catId}/subcategories/${bundle._subId}/products/${bundle._prodId}')">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                    ${noImg ? '<div class="product-img" style="background:linear-gradient(135deg,var(--accent-start),var(--accent-end));opacity:0.3;"></div>' : `<img src="${bundle.image}" class="product-img" onerror="this.style.display='none'">`}
                    <div class="product-info">
                        <h4>${bundle.name}</h4>
                        <div class="product-price">
                            \u20b9${Number(bundle.price).toLocaleString('en-IN')}
                            ${bundle.originalPrice ? `<span style="text-decoration:line-through; color:var(--text-secondary); font-weight:400; font-size:12px; margin-left:8px;">\u20b9${Number(bundle.originalPrice).toLocaleString('en-IN')}</span>` : ''}
                        </div>
                    </div>
                </div>
                `;
            }
            html += '</div>';
            list.innerHTML = html;
        }

        // --- INSIGHTS ---
        function updateInsights() {
            let prodCount = 0;
            let totalValue = 0;

            for (const c in catalogData) {
                if (catalogData[c].subcategories) {
                    for (const s in catalogData[c].subcategories) {
                        if (catalogData[c].subcategories[s].products) {
                            for (const p in catalogData[c].subcategories[s].products) {
                                prodCount++;
                                totalValue += Number(catalogData[c].subcategories[s].products[p].price) || 0;
                            }
                        }
                    }
                }
            }

            animateValue('stat-prod', prodCount);
            document.getElementById('stat-val').innerText = '\u20b9' + totalValue.toLocaleString('en-IN');
        }

        function animateValue(id, end) {
            const obj = document.getElementById(id);
            let start = parseInt(obj.innerText) || 0;
            if (start === end) return;
            const duration = 1000;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerText = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        // --- MODAL & CRUD LOGIC ---
        let modalContext = {};

        function openBundleModal(catId=null, subId=null, prodId=null) {
            // For new bundles, use default path. For editing, use the actual path.
            const editCat = catId || DEFAULT_CAT_ID;
            const editSub = subId || DEFAULT_SUB_ID;
            modalContext = { type: 'bundle', catId: editCat, subId: editSub, prodId };
            
            const mBody = document.getElementById('modalBody');
            const isEdit = !!prodId;
            document.getElementById('modalTitle').innerText = isEdit ? 'Edit Bundle' : 'Add Bundle';
            
            let prod = { name:'', price:'', originalPrice:'', description:'', image:'', contentBlocks:{} };
            if (isEdit) {
                try {
                    prod = catalogData[editCat].subcategories[editSub].products[prodId];
                    if (!prod.contentBlocks) prod.contentBlocks = {};
                } catch(e) { prod = { name:'', price:'', originalPrice:'', description:'', image:'', contentBlocks:{} }; }
            }
            
            let blocksHtml = '';
            const sortedBlocks = Object.keys(prod.contentBlocks || {})
                .map(key => ({ id: key, ...prod.contentBlocks[key] }))
                .sort((a, b) => (a.order || 0) - (b.order || 0));
            
            sortedBlocks.forEach(block => {
                blocksHtml += `
                <div class="content-block-row" data-block-id="${block.id}" data-block-type="${block.type}">
                    <div class="block-type-label">${block.type}</div>
                    ${block.type === 'text' 
                        ? `<textarea class="block-value" rows="2">${block.value}</textarea>`
                        : `<input type="text" class="block-value" value="${block.value}">`
                    }
                    <button class="btn-icon btn-delete" onclick="this.closest('.content-block-row').remove()">
                        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                </div>`;
            });

            mBody.innerHTML = `
                <div class="form-group">
                    <label>Bundle Name</label>
                    <input type="text" id="fm_name" value="${prod.name || ''}" placeholder="e.g. Epic Crash Bundle">
                </div>
                <div class="form-group">
                    <label>Selling Price (\u20b9)</label>
                    <input type="number" id="fm_price" value="${prod.price || ''}" min="0">
                </div>
                <div class="form-group">
                    <label>Original Price (\u20b9)</label>
                    <input type="number" id="fm_originalPrice" value="${prod.originalPrice || ''}" min="0">
                </div>
                <div class="form-group">
                    <label>Bundle Image</label>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div id="fm_image_preview" style="width:100%; height:120px; border-radius:8px; background:var(--bg-base); border:1px solid var(--border-color); display:flex; align-items:center; justify-content:center; overflow:hidden; ${prod.image ? '' : 'display:none;'}">
                            ${prod.image ? `<img src="${prod.image}" style="width:100%; height:100%; object-fit:cover;" onerror="this.parentElement.style.display='none'">` : ''}
                        </div>
                        <input type="hidden" id="fm_image" value="${prod.image || ''}">
                        <label for="fm_image_upload" style="display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; background:rgba(121,87,255,0.1); border:1px dashed var(--accent-start); border-radius:8px; cursor:pointer; color:var(--accent-start); font-size:13px; font-weight:600; margin-bottom:0;">
                            <svg viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                            Upload Image
                        </label>
                        <input type="file" id="fm_image_upload" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="color:var(--text-secondary); font-size:12px;">or paste URL:</span>
                            <input type="url" id="fm_image_url" value="${prod.image || ''}" placeholder="https://..." oninput="document.getElementById('fm_image').value=this.value" style="flex:1;">
                        </div>
                        <div id="upload_progress" style="display:none; font-size:12px; color:var(--accent-start);">Uploading...</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="fm_desc" rows="3">${prod.description || ''}</textarea>
                </div>
                <div class="content-blocks-editor">
                    <label>Content Blocks</label>
                    <div id="contentBlocksContainer">
                        ${blocksHtml}
                    </div>
                    <div class="add-block-menu">
                        <button class="add-block-btn" onclick="addContentBlock('heading')">+ Heading</button>
                        <button class="add-block-btn" onclick="addContentBlock('subheading')">+ Subheading</button>
                        <button class="add-block-btn" onclick="addContentBlock('text')">+ Text</button>
                    </div>
                </div>
            `;
            document.getElementById('formModal').classList.add('active');
            setTimeout(() => document.getElementById('fm_name').focus(), 100);
        }

        function closeModal() {
            document.getElementById('formModal').classList.remove('active');
        }

        function addContentBlock(type) {
            const container = document.getElementById('contentBlocksContainer');
            const blockId = uid();
            const div = document.createElement('div');
            div.className = 'content-block-row';
            div.dataset.blockId = blockId;
            div.dataset.blockType = type;
            
            const inputHtml = type === 'text' 
                ? `<textarea class="block-value" rows="2"></textarea>`
                : `<input type="text" class="block-value">`;

            div.innerHTML = `
                <div class="block-type-label">${type}</div>
                ${inputHtml}
                <button class="btn-icon btn-delete" onclick="this.closest('.content-block-row').remove()">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            `;
            container.appendChild(div);
        }

        function gatherContentBlocks() {
            const blocks = {};
            document.querySelectorAll('.content-block-row').forEach((row, index) => {
                const id = row.dataset.blockId || uid();
                blocks[id] = {
                    type: row.dataset.blockType,
                    value: row.querySelector('.block-value').value.trim(),
                    order: index
                };
            });
            return blocks;
        }

        function saveModalData() {
            const nameEl = document.getElementById('fm_name');
            if (!nameEl.value.trim()) { showToast('Name is required', 'error'); return; }

            const btn = document.getElementById('modalSaveBtn');
            btn.innerText = 'Saving...';
            btn.disabled = true;

            const { catId, subId, prodId } = modalContext;
            const priceVal = document.getElementById('fm_price').value;
            if (!priceVal || priceVal < 0) { showToast('Valid price required', 'error'); btn.innerText='Save'; btn.disabled=false; return; }
            
            const id = prodId || uid();
            const data = {
                name: nameEl.value.trim(),
                price: Number(priceVal),
                originalPrice: Number(document.getElementById('fm_originalPrice').value) || 0,
                image: document.getElementById('fm_image').value.trim(),
                description: document.getElementById('fm_desc').value.trim(),
                contentBlocks: gatherContentBlocks()
            };

            // Ensure default path exists, then save
            ensureDefaultPath().then(() => {
                const refPath = `${STORAGE_KEY}/categories/${catId}/subcategories/${subId}/products/${id}`;
                db.ref(refPath).update(data).then(() => { finishSave('Bundle saved'); });
            });
        }

        function finishSave(msg) {
            closeModal();
            showToast(msg);
            const btn = document.getElementById('modalSaveBtn');
            btn.innerText = 'Save';
            btn.disabled = false;
        }

        // --- DELETE ---
        let deletePathContext = '';
        function confirmDelete(path) {
            deletePathContext = path;
            document.getElementById('confirmModal').classList.add('active');
        }

        document.getElementById('confirmBtn').addEventListener('click', () => {
            if(deletePathContext) {
                db.ref(`${STORAGE_KEY}/${deletePathContext}`).remove().then(() => {
                    document.getElementById('confirmModal').classList.remove('active');
                    showToast('Item deleted successfully');
                }).catch(err => {
                    showToast(err.message, 'error');
                });
            }
        });

        // --- SETTINGS ---
        function updatePassword() {
            const cur = document.getElementById('cp_current').value;
            const neu = document.getElementById('cp_new').value;
            const conf = document.getElementById('cp_confirm').value;

            if (cur !== actualPassword) { showToast('Current password incorrect', 'error'); return; }
            if (neu.length < 4) { showToast('New password must be at least 4 characters', 'error'); return; }
            if (neu !== conf) { showToast('New passwords do not match', 'error'); return; }

            db.ref(`${STORAGE_KEY}/settings/password`).set(neu).then(() => {
                actualPassword = neu;
                document.getElementById('cp_current').value = '';
                document.getElementById('cp_new').value = '';
                document.getElementById('cp_confirm').value = '';
                showToast('Password updated successfully');
            }).catch(err => showToast(err.message, 'error'));
        }

    </script>
</body>
</html>
