<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Clips | Premium Digital Clips</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-color: #0F0F12;
            --card-bg: #1A1A24;
            --surface-color: #252535;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B8;
            --accent-gradient: linear-gradient(135deg, #7957FF, #FF4D9D);
            --discount-color: #00CC66;
            --strike-color: #888888;
            --glass-bg: rgba(26, 26, 36, 0.7);
            --glass-border: rgba(255, 255, 255, 0.05);
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
        }
        
        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 1. Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1.25rem 2rem;
            text-align: center;
        }
        
        .brand-title {
            font-size: 1.75rem;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }
        
        .tagline {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Main Layout */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding-bottom: 100px; /* Space for sticky cart */
        }

        /* Breadcrumbs */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .breadcrumb-item {
            cursor: pointer;
            transition: color var(--transition-speed) ease;
        }
        
        .breadcrumb-item:hover {
            color: var(--text-primary);
        }

        .breadcrumb-separator {
            opacity: 0.5;
        }

        /* Grid Layouts */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            opacity: 1;
            transition: opacity var(--transition-speed) ease;
        }
        
        .grid.fade-out {
            opacity: 0;
        }
        /* Navigation Cards (Categories/Subcategories) */
        .nav-card {
            background: rgba(65, 65, 65, 0.11);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(144, 161, 255, 0.171);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: 400ms;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .nav-card::before {
            content: "";
            background-color: #7957ff4b;
            position: absolute;
            filter: blur(30px);
            border-radius: 50%;
            width: 10rem;
            height: 10rem;
            top: -20%;
            left: -20%;
            z-index: -1;
        }
        
        .nav-card::after {
            content: "";
            background-color: #ff4d9d4b;
            position: absolute;
            filter: blur(30px);
            border-radius: 50%;
            width: 8rem;
            height: 8rem;
            bottom: -20%;
            right: -20%;
            z-index: -1;
        }
        
        .nav-card > * {
            position: relative;
            z-index: 2;
        }

        .nav-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: rgba(121, 87, 255, 0.4);
        }

        .grid:hover > .nav-card:not(:hover) {
            filter: blur(5px);
            transform: scale(0.95);
        }
        
        .nav-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* 3. Product Cards (Glassmorphism) */
        .product-card {
            background: rgba(65, 65, 65, 0.11);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(144, 161, 255, 0.171);
            border-radius: 16px;
            overflow: hidden;
            transition: 400ms;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }
        
        .product-card::before {
            content: "";
            background-color: #7957ff4b;
            position: absolute;
            filter: blur(30px);
            border-radius: 50%;
            width: 10rem;
            height: 10rem;
            top: -10%;
            left: -10%;
            z-index: -1;
        }
        
        .product-card::after {
            content: "";
            background-color: #ff4d9d4b;
            position: absolute;
            filter: blur(30px);
            border-radius: 50%;
            width: 8rem;
            height: 8rem;
            bottom: -10%;
            right: -10%;
            z-index: -1;
        }
        
        .product-card > * {
            position: relative;
            z-index: 2;
        }

        .product-card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border-color: rgba(121, 87, 255, 0.4);
        }
        
        .grid:hover > .product-card:not(:hover) {
            filter: blur(5px);
            transform: scale(0.95);
        }

        .product-image-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(45deg, #1A1A24, #252535);
            position: relative;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .actual-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }
        
        .actual-price.discounted {
            color: #e6ffe6;
        }

        .original-price {
            font-size: 0.9rem;
            color: var(--strike-color);
            text-decoration: line-through;
        }

        .discount-badge {
            font-size: 0.85rem;
            color: var(--discount-color);
            font-weight: 700;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .view-details {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: color var(--transition-speed) ease;
        }

        .view-details:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }

        .btn {
            background: var(--surface-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            width: 100%;
            text-align: center;
        }

        .btn-gradient {
            background: var(--accent-gradient);
            box-shadow: 0 4px 15px rgba(255, 77, 157, 0.3);
        }

        .btn-gradient:hover {
            box-shadow: 0 6px 20px rgba(255, 77, 157, 0.5);
            transform: translateY(-1px);
        }
        
        .btn-gradient:active {
            transform: translateY(1px);
        }

        /* 4. Product Details Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: background var(--transition-speed) ease;
        }

        .modal-close:hover {
            background: var(--surface-color);
        }

        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: var(--surface-color);
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-title {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .modal-description {
            margin: 2rem 0;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .modal-description h2 {
            font-size: 1.3rem;
            margin: 1.5rem 0 0.75rem;
            color: white;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .modal-description h3 {
            font-size: 1.1rem;
            margin: 1.25rem 0 0.5rem;
            color: #D0D0E0;
        }
        
        .modal-description p {
            margin-bottom: 1rem;
        }

        .modal-policies {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
        }
        
        .policy-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .policy-item:last-child {
            margin-bottom: 0;
        }
        
        .policy-icon {
            font-size: 1.25rem;
        }
        
        .policy-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        .policy-text strong {
            color: white;
            display: block;
            margin-bottom: 0.25rem;
        }

        /* 5. Sticky Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
        }

        .cart-bar.visible {
            transform: translateY(0);
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .cart-items-count {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .cart-total {
            font-size: 1.25rem;
            font-weight: 700;
        }
        
        .cart-total-value {
            color: white;
        }

        .cart-bar .btn-gradient {
            padding: 0.75rem 2rem;
            width: auto;
        }

        /* 6. Footer */
        footer {
            margin-top: auto;
            border-top: 1px solid var(--glass-border);
            background: var(--bg-color);
            padding: 4rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .footer-brand {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .footer-logo {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .footer-tagline {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .social-icons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .social-icons a {
            color: var(--text-secondary);
            transition: color var(--transition-speed) ease, transform var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icons a:hover {
            color: white;
            transform: translateY(-2px);
        }

        .social-icons svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .copyright {
            color: #666;
            font-size: 0.85rem;
            margin-top: 2rem;
            max-width: 1200px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        /* States & Utilities */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            min-height: 300px;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        /* Uiverse.io Loader */
        .loader {
          --background: linear-gradient(135deg, #23C4F8, #275EFE);
          --shadow: rgba(39, 94, 254, 0.28);
          --text: #6C7486;
          --page: rgba(255, 255, 255, 0.36);
          --page-fold: rgba(255, 255, 255, 0.52);
          --duration: 3s;
          width: 200px;
          height: 140px;
          position: relative;
        }

        .loader:before, .loader:after {
          --r: -6deg;
          content: "";
          position: absolute;
          bottom: 8px;
          width: 120px;
          top: 80%;
          box-shadow: 0 16px 12px var(--shadow);
          transform: rotate(var(--r));
        }

        .loader:before {
          left: 4px;
        }

        .loader:after {
          --r: 6deg;
          right: 4px;
        }

        .loader div {
          width: 100%;
          height: 100%;
          border-radius: 13px;
          position: relative;
          z-index: 1;
          perspective: 600px;
          box-shadow: 0 4px 6px var(--shadow);
          background-image: var(--background);
        }

        .loader div ul {
          margin: 0;
          padding: 0;
          list-style: none;
          position: relative;
        }

        .loader div ul li {
          --r: 180deg;
          --o: 0;
          --c: var(--page);
          position: absolute;
          top: 10px;
          left: 10px;
          transform-origin: 100% 50%;
          color: var(--c);
          opacity: var(--o);
          transform: rotateY(var(--r));
          -webkit-animation: var(--duration) ease infinite;
          animation: var(--duration) ease infinite;
        }

        .loader div ul li:nth-child(2) {
          --c: var(--page-fold);
          -webkit-animation-name: page-2;
          animation-name: page-2;
        }

        .loader div ul li:nth-child(3) {
          --c: var(--page-fold);
          -webkit-animation-name: page-3;
          animation-name: page-3;
        }

        .loader div ul li:nth-child(4) {
          --c: var(--page-fold);
          -webkit-animation-name: page-4;
          animation-name: page-4;
        }

        .loader div ul li:nth-child(5) {
          --c: var(--page-fold);
          -webkit-animation-name: page-5;
          animation-name: page-5;
        }

        .loader div ul li svg {
          width: 90px;
          height: 120px;
          display: block;
        }

        .loader div ul li:first-child {
          --r: 0deg;
          --o: 1;
        }

        .loader div ul li:last-child {
          --o: 1;
        }

        .loader span {
          display: block;
          left: 0;
          right: 0;
          top: 100%;
          margin-top: 20px;
          text-align: center;
          color: var(--text);
        }

        @keyframes page-2 {
          0% {
            transform: rotateY(180deg);
            opacity: 0;
          }

          20% {
            opacity: 1;
          }

          35%, 100% {
            opacity: 0;
          }

          50%, 100% {
            transform: rotateY(0deg);
          }
        }

        @keyframes page-3 {
          15% {
            transform: rotateY(180deg);
            opacity: 0;
          }

          35% {
            opacity: 1;
          }

          50%, 100% {
            opacity: 0;
          }

          65%, 100% {
            transform: rotateY(0deg);
          }
        }

        @keyframes page-4 {
          30% {
            transform: rotateY(180deg);
            opacity: 0;
          }

          50% {
            opacity: 1;
          }

          65%, 100% {
            opacity: 0;
          }

          80%, 100% {
            transform: rotateY(0deg);
          }
        }

        @keyframes page-5 {
          45% {
            transform: rotateY(180deg);
            opacity: 0;
          }

          65% {
            opacity: 1;
          }

          80%, 100% {
            opacity: 0;
          }

          95%, 100% {
            transform: rotateY(0deg);
          }
        }

        /* Responsive */
        @media (max-width: 768px) {
            /* Disable Glassmorphism blur for performance, but KEEP the background transparency to let the glowing blobs show through */
            header, .cart-bar {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(26,26,36,0.95);
            }
            .nav-card, .product-card {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(65, 65, 65, 0.11);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }

            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .nav-card {
                padding: 10px;
            }
            .nav-card h3 {
                font-size: 14px;
            }
            .product-card {
                border-radius: 10px;
            }
            .product-image-container {
                aspect-ratio: auto;
                height: 110px;
                min-height: 110px;
            }
            .product-image {
                height: 110px;
                position: relative;
            }
            .product-info {
                padding: 10px;
            }
            .product-title {
                font-family: 'Inter', sans-serif;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 5px;
                line-height: 1.2;
            }
            .price-container {
                margin-bottom: 5px;
                gap: 4px;
            }
            .actual-price {
                font-size: 14px;
            }
            .original-price, .discount-badge {
                font-size: 10px;
            }
            .card-actions {
                margin-top: auto;
                display: flex;
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
            .view-details {
                font-size: 11px;
                margin-bottom: 0;
            }
            .btn {
                padding: 6px;
                font-size: 12px;
                border-radius: 6px;
                width: 100%;
            }
            
            .hero h1 {
                font-size: 2.5rem;
            }
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }
            .product-actions {
                flex-direction: column;
            }
            header {
                padding: 1rem;
            }
            main {
                padding: 1rem;
                padding-bottom: 120px;
            }
            .cart-bar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .cart-info {
                width: 100%;
                justify-content: space-between;
                gap: 1rem;
            }
            .cart-bar .btn-gradient {
                width: 100%;
            }
            .modal-body {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Sticky Header -->
    <header>
        <h1 class="brand-title gradient-text">Raw Clips</h1>
        <p class="tagline">Premium Digital Clips • Unfiltered. Uncut. Unreal.</p>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Content Container -->
        <div id="content-container">
            <div class="loading">
                <!-- From Uiverse.io by Nawsome --> 
                <div class="loader">
                  <div>
                    <ul>
                      <li>

    <!-- Logic -->
    <script>
        // --- Configuration & Initialization ---
        const firebaseConfig = {
            apiKey: "AIzaSyCPHJPLO_pA_T4UD8W5s7nm418HWuNydfc",
            authDomain: "fabricane-2366c.firebaseapp.com",
            databaseURL: "https://fabricane-2366c-default-rtdb.firebaseio.com",
            projectId: "fabricane-2366c",
            storageBucket: "fabricane-2366c.firebasestorage.app",
            messagingSenderId: "731658632483",
            appId: "1:731658632483:web:359737f7226edb686d2096"
        };
        const STORAGE_KEY = "beamng_store_v1";
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- State Management ---
        let rawData = {};
        let allProducts = {}; // flat map: prodId -> product object

        // --- Cart Management ---
        const CART_STORAGE_KEY = 'rawclips_cart';
        let cart = { items: [] };

        function loadCart() {
            const saved = localStorage.getItem(CART_STORAGE_KEY);
            if (saved) {
                try { cart = JSON.parse(saved); } catch (e) { cart = { items: [] }; }
            }
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
            updateCartUI();
        }

        function isItemInCart(prodId) {
            return cart && cart.items && cart.items.some(i => i.id === prodId);
        }

        function toggleCartItem(e, prodId) {
            if (e) e.stopPropagation();
            const existingIndex = cart.items.findIndex(i => i.id === prodId);
            
            if (existingIndex >= 0) {
                // Remove from cart
                cart.items.splice(existingIndex, 1);
            } else {
                // Add to cart
                const prod = allProducts[prodId];
                if (prod) {
                    cart.items.push({
                        id: prod.id,
                        name: prod.name,
                        price: prod.price,
                        qty: 1
                    });
                }
            }
            saveCart();
            updateCartButtons(prodId);
        }

        function updateCartButtons(prodId) {
            const inCart = isItemInCart(prodId);
            document.querySelectorAll(`.cart-btn-${prodId}`).forEach(btn => {
                if (inCart) {
                    btn.innerHTML = `Added ✓<br><span style="font-size:0.75em; opacity:0.9; font-weight:normal;">Click to remove</span>`;
                    btn.style.background = "#00CC66";
                } else {
                    btn.innerHTML = "Add to cart";
                    btn.style.background = ""; // reverts to css class
                }
            });
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cart-bar');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            const totalItems = cart.items.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.items.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (totalItems > 0) {
                cartCount.innerText = `${totalItems} item${totalItems !== 1 ? 's' : ''}`;
                cartTotal.innerText = `₹${totalPrice}`;
                cartBar.classList.add('visible');
            } else {
                cartBar.classList.remove('visible');
            }
        }

        // Checkout Action
        document.getElementById('btn-checkout').addEventListener('click', () => {
            if(cart.items.length === 0) return;
            const bundleNames = cart.items.map(i => `${i.qty > 1 ? i.qty+'x ' : ''}${i.name}`).join(', ');
            const total = cart.items.reduce((sum, i) => sum + (i.price * i.qty), 0);
            window.location.href = `https://tally.so/r/D4oVGZ?bundle=${encodeURIComponent(bundleNames)}&price=${encodeURIComponent(total)}`;
        });

        // --- Data Fetching ---
        database.ref(STORAGE_KEY + '/categories').on('value', (snapshot) => {
            rawData = snapshot.val() || {};
            // Flatten all products from all categories/subcategories into one map
            allProducts = {};
            for (const catId in rawData) {
                const cat = rawData[catId];
                if (!cat.subcategories) continue;
                for (const subId in cat.subcategories) {
                    const sub = cat.subcategories[subId];
                    if (!sub.products) continue;
                    for (const prodId in sub.products) {
                        allProducts[prodId] = sub.products[prodId];
                        allProducts[prodId].id = prodId;
                    }
                }
            }
            
            // Clean up cart: remove items that no longer exist in the catalog
            if (cart && cart.items) {
                cart.items = cart.items.filter(item => allProducts[item.id]);
                saveCart();
            }

            renderAllProducts();
        });

        // --- Render All Products (Flat Grid) ---
        function renderAllProducts() {
            const container = document.getElementById('content-container');
            const productIds = Object.keys(allProducts);

            if (productIds.length === 0) {
                container.innerHTML = `<div class="empty-state"><h3>Coming Soon</h3><p>We are preparing some amazing clips for you. Stay tuned!</p></div>`;
                return;
            }

            let html = `<div class="grid">`;
            for (const [id, prod] of Object.entries(allProducts)) {
                const price = Number(prod.price) || 0;
                const origPrice = Number(prod.originalPrice) || 0;
                const hasDiscount = origPrice > price && origPrice > 0;
                const discount = hasDiscount ? Math.round(((origPrice - price) / origPrice) * 100) : 0;
                const imgUrl = prod.image || '';

                html += `
                    <div class="product-card">
                        <div class="product-image-container">
                            ${imgUrl ? `<img src="${escapeHtml(imgUrl)}" class="product-image" alt="${escapeHtml(prod.name)}" loading="lazy">` : ''}
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${escapeHtml(prod.name)}</h3>
                            <div class="price-container">
                                <span class="actual-price ${hasDiscount ? 'discounted' : ''}">₹${price}</span>
                                ${hasDiscount ? `
                                    <span class="original-price">₹${origPrice}</span>
                                    <span class="discount-badge">(${discount}% off)</span>
                                ` : ''}
                            </div>
                            <div class="card-actions">
                                <a class="view-details" onclick="openProductModal('${id}')">View details</a>
                                <button class="btn btn-gradient cart-btn-${id}" style="${isItemInCart(id) ? 'background:#00CC66;' : ''}" onclick="toggleCartItem(event, '${id}')">
                                    ${isItemInCart(id) ? 'Added ✓<br><span style="font-size:0.75em; opacity:0.9; font-weight:normal;">Click to remove</span>' : 'Add to cart'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        // --- Modal Management ---
        const modal = document.getElementById('product-modal');
        const modalContent = document.getElementById('modal-content');

        window.openProductModal = function(prodId) {
            const prod = allProducts[prodId];
            if (!prod) return;
            prod.id = prodId;

            const price = Number(prod.price) || 0;
            const origPrice = Number(prod.originalPrice) || 0;
            const hasDiscount = origPrice > price && origPrice > 0;
            const discount = hasDiscount ? Math.round(((origPrice - price) / origPrice) * 100) : 0;

            // Description logic
            let descHtml = '';
            if (prod.contentBlocks) {
                // sort content blocks by order
                const blocks = Object.values(prod.contentBlocks).sort((a, b) => (a.order || 0) - (b.order || 0));
                for(const b of blocks) {
                    if(b.type === 'heading') descHtml += `<h2>${escapeHtml(b.value)}</h2>`;
                    else if(b.type === 'subheading') descHtml += `<h3>${escapeHtml(b.value)}</h3>`;
                    else descHtml += `<p>${escapeHtml(b.value)}</p>`;
                }
            } else if (prod.description) {
                descHtml = `<p>${escapeHtml(prod.description).replace(/\n/g, '<br>')}</p>`;
            }

            modalContent.innerHTML = `
                <button class="modal-close" onclick="closeModal()">×</button>
                ${prod.image ? `<img src="${escapeHtml(prod.image)}" class="modal-image" alt="Product Image">` : `<div class="modal-image"></div>`}
                <div class="modal-body">
                    <h2 class="modal-title">${escapeHtml(prod.name)}</h2>
                    <div class="price-container" style="font-size: 1.1em; margin-bottom: 0;">
                        <span class="actual-price ${hasDiscount ? 'discounted' : ''}">₹${price}</span>
                        ${hasDiscount ? `
                            <span class="original-price">₹${origPrice}</span>
                            <span class="discount-badge">(${discount}% off)</span>
                        ` : ''}
                    </div>
                    
                    <div class="modal-description">
                        ${descHtml}
                    </div>
                    
                    <div class="modal-policies">
                        <div class="policy-item">
                            <span class="policy-icon">📞</span>
                            <div class="policy-text">
                                <strong>Support</strong>
                                For support or inquiries, please contact us on WhatsApp at +91 6360322076 or +91 8310747226.
                            </div>
                        </div>
                        <div class="policy-item">
                            <span class="policy-icon">🛡️</span>
                            <div class="policy-text">
                                <strong>Buyer Protection</strong>
                                100% Buyer Protection: If any fraud is found or delivery fails, your money will be fully returned to you, guaranteed.
                            </div>
                        </div>
                    </div>
                    
                    <button class="btn btn-gradient cart-btn-${prodId}" style="font-size: 1.1rem; padding: 1rem; ${isItemInCart(prodId) ? 'background:#00CC66;' : ''}" onclick="toggleCartItem(event, '${prodId}')">
                        ${isItemInCart(prodId) ? 'Added ✓<br><span style="font-size:0.75em; opacity:0.9; font-weight:normal;">Click to remove</span>' : 'Add to cart'}
                    </button>
                </div>
            `;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // prevent bg scroll
        };

        window.closeModal = function() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        };

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        // Utilities
        function escapeHtml(unsafe) {
            if(!unsafe) return '';
            return unsafe
                 .toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Init
        loadCart();

    </script>
